name: Refresh MusicQuiz catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 20 * * 0"
  push:
    branches: [main]
    paths:
      - "music-quiz/artists.txt"
      - "music-quiz/apple_catalog.py"
      - "music-quiz/validate_catalog.py"
      - ".github/workflows/refresh-music-quiz-catalog.yml"

permissions:
  contents: write

concurrency:
  group: refresh-music-quiz-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build public Apple preview catalog
        run: |
          python music-quiz/apple_catalog.py \
            --artists-file music-quiz/artists.txt \
            --country us \
            --max-per-artist 40 \
            --min-tracks 100 \
            --out music-quiz/catalog.json
      - name: Validate catalog and sample preview URLs
        run: python music-quiz/validate_catalog.py music-quiz/catalog.json --sample 8 --min-tracks 100
      - name: Commit refreshed public catalog
        run: |
          if git diff --quiet -- music-quiz/catalog.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-quiz/catalog.json
          git commit -m "chore: refresh MusicQuiz catalog [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
