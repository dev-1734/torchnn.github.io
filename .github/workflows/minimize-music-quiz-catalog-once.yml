name: Minimize MusicQuiz catalog once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/minimize-music-quiz-catalog-once.yml"

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strip non-app catalog metadata
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("music-quiz/catalog.json")
          source = json.loads(path.read_text(encoding="utf-8"))
          tracks = source.get("tracks") or []
          if len(tracks) < 100:
              raise SystemExit(f"catalog too small: {len(tracks)}")

          required = ("id", "title", "artist", "source", "previewURL")
          optional = ("storeURL", "artworkURL")
          public_tracks = []
          for track in tracks:
              if any(not track.get(key) for key in required):
                  raise SystemExit(f"invalid track: {track.get('id')!r}")
              if not str(track["previewURL"]).startswith("https://"):
                  raise SystemExit(f"non-HTTPS preview: {track['id']}")
              item = {key: track[key] for key in required}
              for key in optional:
                  if track.get(key):
                      item[key] = track[key]
              public_tracks.append(item)

          payload = {"generatedAt": source.get("generatedAt"), "tracks": public_tracks}
          if not payload["generatedAt"]:
              raise SystemExit("missing generatedAt")
          path.write_text(json.dumps(payload, ensure_ascii=False, separators=(",", ":")), encoding="utf-8")
          print(f"minimized {len(public_tracks)} tracks")
          PY
      - name: Commit minimized catalog and remove this one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music-quiz/catalog.json
          git rm .github/workflows/minimize-music-quiz-catalog-once.yml
          git commit -m "chore: minimize MusicQuiz public catalog [skip ci]"
          git push origin HEAD:main
